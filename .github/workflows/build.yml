name: Build GHOST CLONAGE WINDOWS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire uniquement pour publier une Release sur un tag v*

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Tests du moteur (disques virtuels)
        run: dotnet test tests/Ghost.Core.Tests -c Release --logger "trx;LogFileName=tests.trx"

      - name: Publication de l'application (WPF, autonome win-x64)
        run: dotnet publish src/Ghost.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }} -o publish/app

      - name: Publication de la version console (WinPE)
        run: dotnet publish src/Ghost.Cli -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }} -o publish/cli

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construire l'installateur
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ env.APP_VERSION }}" installer\GhostClonage.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }

      - name: Empreintes SHA-256 des livrables
        shell: pwsh
        run: |
          Get-ChildItem installer\Output\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -FilePath installer\Output\SHA256SUMS.txt -Append
          }

      - name: Archive portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish\app\* -DestinationPath artifacts\GhostClonage-portable-${{ env.APP_VERSION }}.zip
          Compress-Archive -Path publish\cli\*, tools\winpe\* -DestinationPath artifacts\GhostClonage-WinPE-kit-${{ env.APP_VERSION }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GhostClonage-installateur
          path: installer/Output/*

      - uses: actions/upload-artifact@v4
        with:
          name: GhostClonage-portable-et-kit-WinPE
          path: artifacts/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests
          path: '**/tests.trx'

      - name: Publier la Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*
            artifacts/*
