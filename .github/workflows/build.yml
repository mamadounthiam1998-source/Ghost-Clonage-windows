name: Build GHOST CLONAGE WINDOWS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire uniquement pour publier une Release sur un tag v*

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Préparer les dossiers de diagnostic
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\diag", "$env:RUNNER_TEMP\shots" | Out-Null

      - name: Tests du moteur (disques virtuels)
        shell: pwsh
        run: |
          dotnet test tests/Ghost.Core.Tests -c Release --logger "trx;LogFileName=tests.trx" 2>&1 | Tee-Object "$env:RUNNER_TEMP\diag\1-moteur.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test de l'interface WPF réelle (fenêtre, 3 modes, clonage/image/restauration)
        shell: pwsh
        env:
          GHOST_UI_SHOTS: ${{ runner.temp }}\shots
        run: |
          dotnet test tests/Ghost.App.Tests -c Release --logger "console;verbosity=detailed" 2>&1 | Tee-Object "$env:RUNNER_TEMP\diag\2-interface.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Publication de l'application (WPF, autonome win-x64)
        run: dotnet publish src/Ghost.App -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }} -o publish/app

      - name: Publication de la version console (WinPE)
        run: dotnet publish src/Ghost.Cli -c Release -r win-x64 --self-contained true -p:Version=${{ env.APP_VERSION }} -o publish/cli

      - name: Lancement réel de l'exécutable publié (contrôle de démarrage)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\diag\3-lancement.log"
          Remove-Item $out, "$out.bindings.txt" -ErrorAction SilentlyContinue
          $env:GHOST_SMOKE = '1'; $env:GHOST_SMOKE_OUT = $out
          $p = Start-Process -FilePath "publish\app\GhostClonage.exe" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Add-Content $out "ECHEC : l'application ne s'est pas terminée (boîte d'erreur ouverte ?)"; exit 1 }
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { Write-Host "Code de sortie : $($p.ExitCode)"; exit 1 }

      - name: Test d'intégration réel (VHDX) — clone, image, restauration
        shell: pwsh
        run: |
          ./tools/ci/Integration-Test.ps1 -CliPath "$PWD\publish\cli\GhostClonageCli.exe" -LogFile "$env:RUNNER_TEMP\diag\4-integration.log"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Diagnostics (visibles dans les annotations du job)
        if: always()
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem "$env:RUNNER_TEMP\diag\*.log" -ErrorAction SilentlyContinue) {
            $t = Get-Content $f.FullName -Raw
            if (-not $t) { continue }
            if ($t.Length -gt 7000) { $t = $t.Substring($t.Length - 7000) }
            $e = $t -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::notice title=$($f.Name)::$e"
          }

      - name: Installer Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Construire l'installateur
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ env.APP_VERSION }}" installer\GhostClonage.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC a échoué ($LASTEXITCODE)" }

      - name: Empreintes SHA-256 des livrables
        shell: pwsh
        run: |
          Get-ChildItem installer\Output\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -FilePath installer\Output\SHA256SUMS.txt -Append
          }

      - name: Archive portable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish\app\* -DestinationPath artifacts\GhostClonage-portable-${{ env.APP_VERSION }}.zip
          Compress-Archive -Path publish\cli\*, tools\winpe\* -DestinationPath artifacts\GhostClonage-WinPE-kit-${{ env.APP_VERSION }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: GhostClonage-installateur
          path: installer/Output/*

      - uses: actions/upload-artifact@v4
        with:
          name: GhostClonage-portable-et-kit-WinPE
          path: artifacts/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests
          path: |
            **/tests.trx
            ${{ runner.temp }}/diag/*.log
            ${{ runner.temp }}/diag/*.txt
            ${{ runner.temp }}/shots/*.png

      - name: Publier la Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/Output/*
            artifacts/*
